name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages Artifact
    runs-on: ubuntu-latest
    env:
      NAROO_API_BASE_URL: ${{ vars.NAROO_API_BASE_URL }}
      NAROO_BUILD_PROFILE: ${{ vars.NAROO_BUILD_PROFILE || 'production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: flutter pub get

      - name: Validate release inputs
        run: |
          if [ -z "$NAROO_API_BASE_URL" ]; then
            echo "Missing GitHub Actions variable: NAROO_API_BASE_URL" >&2
            exit 1
          fi
          case "$NAROO_API_BASE_URL" in
            https://*) ;;
            *)
              echo "NAROO_API_BASE_URL must start with https:// for release builds" >&2
              exit 1
              ;;
          esac

      - name: Build web
        run: |
          flutter build web --release \
            --base-href /naroo_flutter/ \
            --dart-define=NAROO_BUILD_PROFILE="$NAROO_BUILD_PROFILE" \
            --dart-define=NAROO_API_BASE_URL="$NAROO_API_BASE_URL"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages site
        id: deployment
        uses: actions/deploy-pages@v4
