name: Flutter Release

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Analyze and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build_web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    env:
      NAROO_API_BASE_URL: ${{ vars.NAROO_API_BASE_URL }}
      NAROO_BUILD_PROFILE: ${{ vars.NAROO_BUILD_PROFILE || 'production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate release inputs
        run: |
          if [ -z "$NAROO_API_BASE_URL" ]; then
            echo "Missing GitHub Actions variable: NAROO_API_BASE_URL" >&2
            exit 1
          fi
          case "$NAROO_API_BASE_URL" in
            https://*) ;;
            *)
              echo "NAROO_API_BASE_URL must start with https:// for release builds" >&2
              exit 1
              ;;
          esac

      - name: Build web
        run: |
          flutter build web --release \
            --dart-define=NAROO_BUILD_PROFILE="$NAROO_BUILD_PROFILE" \
            --dart-define=NAROO_API_BASE_URL="$NAROO_API_BASE_URL"

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

  build_android:
    name: Build Android AAB
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != ''
    env:
      NAROO_API_BASE_URL: ${{ vars.NAROO_API_BASE_URL }}
      NAROO_BUILD_PROFILE: ${{ vars.NAROO_BUILD_PROFILE || 'production' }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate release inputs
        run: |
          if [ -z "$NAROO_API_BASE_URL" ]; then
            echo "Missing GitHub Actions variable: NAROO_API_BASE_URL" >&2
            exit 1
          fi
          case "$NAROO_API_BASE_URL" in
            https://*) ;;
            *)
              echo "NAROO_API_BASE_URL must start with https:// for release builds" >&2
              exit 1
              ;;
          esac

      - name: Prepare Android signing files
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.keystore
          EOF

      - name: Build Android app bundle
        run: |
          flutter build appbundle --release \
            --dart-define=NAROO_BUILD_PROFILE="$NAROO_BUILD_PROFILE" \
            --dart-define=NAROO_API_BASE_URL="$NAROO_API_BASE_URL"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-appbundle
          path: build/app/outputs/bundle/release/app-release.aab
